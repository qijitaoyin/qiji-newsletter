name: Import from Google Drive

on:
  workflow_dispatch:
    inputs:
      expected_issue:
        description: "Expected issue folder/id to verify after import, for example 202606"
        required: false
        default: ""
      build_after_import:
        description: "Run Astro build after import validation"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: import-google-drive
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
      GOOGLE_DRIVE_REMOTE: ${{ vars.GOOGLE_DRIVE_REMOTE }}
      EXPECTED_ISSUE: ${{ inputs.expected_issue }}
      PUBLIC_SITE_URL: https://newsletter.qiji.org.tw
      PUBLIC_BASE_PATH: /
      AI_ALLOW_PAID_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/assets/articles
            public/assets/pixabay
            src/data/pixabayFallbackImages.json
          key: qiji-import-check-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qiji-import-check-${{ runner.os }}-${{ github.ref_name }}-
            qiji-import-check-${{ runner.os }}-

      - name: Validate Google Drive configuration
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:RCLONE_CONFIG_CONTENT) { $missing += "secrets.RCLONE_CONFIG" }
          if (-not $env:GOOGLE_DRIVE_REMOTE) { $missing += "vars.GOOGLE_DRIVE_REMOTE" }

          if ($missing.Count -gt 0) {
            $message = "Google Drive sync is not configured: " + ($missing -join ", ")
            Write-Error $message
          }

          "Google Drive remote: $env:GOOGLE_DRIVE_REMOTE" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Sync Google Drive source
        timeout-minutes: 60
        shell: pwsh
        run: ./scripts/sync_google_drive.ps1

      - name: Generate article data
        shell: pwsh
        run: ./scripts/generate_archive.ps1

      - name: Summarize import result
        shell: pwsh
        run: |
          $validationPath = "reports/import-validation.json"
          $changedPath = "reports/import-changed-files.json"
          $publicChangedPath = "public/data/import-changed-files.json"

          if (-not (Test-Path -LiteralPath $validationPath)) {
            throw "Missing import validation report: $validationPath"
          }

          $validationJson = Get-Content -LiteralPath $validationPath -Raw | ConvertFrom-Json
          $validation = @($validationJson)
          if ($validation.Count -eq 1 -and $validation[0] -is [array]) {
            $validation = @($validation[0])
          }
          $issues = $validation |
            Where-Object { $_.issueId } |
            Group-Object issueId |
            Sort-Object Name -Descending |
            ForEach-Object {
              [pscustomobject]@{
                Issue = $_.Name
                Count = $_.Count
              }
            }

          if (Test-Path -LiteralPath $changedPath) {
            $changedSource = $changedPath
          } elseif (Test-Path -LiteralPath $publicChangedPath) {
            $changedSource = $publicChangedPath
          } else {
            $changedSource = $null
          }

          $summary = @()
          $summary += "# Google Drive import result"
          $summary += ""
          $summary += "- AI metadata generation: disabled"
          $summary += "- GitHub Pages deployment: not run"
          $summary += "- Validation messages: $($validation.Count)"

          if ($env:EXPECTED_ISSUE) {
            $foundExpected = [bool]($issues | Where-Object { $_.Issue -eq $env:EXPECTED_ISSUE })
            $expectedStatus = if ($foundExpected) { "found" } else { "not found" }
            $summary += "- Expected issue ``$($env:EXPECTED_ISSUE)``: $expectedStatus"
          }

          if ($changedSource) {
            $summary += "- Changed-files report: $changedSource"
          } else {
            $summary += "- Changed-files report: not generated"
          }

          $summary += ""
          $summary += "## Issues seen in validation report"
          $summary += ""
          $summary += "| Issue | Validation messages |"
          $summary += "| --- | ---: |"
          foreach ($issue in $issues | Select-Object -First 20) {
            $summary += "| $($issue.Issue) | $($issue.Count) |"
          }
          if ($issues.Count -gt 20) {
            $summary += ""
            $summary += "Only the latest 20 issue ids are shown in this summary."
          }

          $summary -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if ($env:EXPECTED_ISSUE -and -not ($issues | Where-Object { $_.Issue -eq $env:EXPECTED_ISSUE })) {
            Write-Warning "Expected issue $env:EXPECTED_ISSUE was not found after import."
          }

      - name: Build local artifact
        if: ${{ inputs.build_after_import == 'true' }}
        run: pnpm build

      - name: Upload import reports
        uses: actions/upload-artifact@v4
        with:
          name: qiji-google-drive-import-reports
          path: |
            reports
            public/data/import-changed-files.json

      - name: Upload generated article data
        uses: actions/upload-artifact@v4
        with:
          name: qiji-generated-article-data
          path: |
            src/data/generatedArticles.ts
            src/data/generatedReview.ts
            src/data/generatedWordNormalizeReview.ts

      - name: Upload built site preview
        if: ${{ inputs.build_after_import == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qiji-import-build-preview
          path: dist
