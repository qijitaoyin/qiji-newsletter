name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Generate AI metadata before build"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      paid_ai_confirm:
        description: "Allow paid AI API calls for missing/changed metadata"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ai_issue_id:
        description: "Issue id for AI metadata, changed, or latest"
        required: true
        default: "changed"
      ai_limit:
        description: "Limit AI articles; 0 means no limit"
        required: true
        default: "0"
      sync_drive:
        description: "Sync Google Drive before build"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      review_publish_json:
        description: "Optional JSON copied from /review/ publish confirmation"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The review webhook first commits the confirmation, then dispatches this
    # workflow with the full payload. Do not deploy that intermediate commit:
    # it would queue behind the dispatched run, use a stale checkout, and race
    # with the metadata/publish commits created by the dispatched run.
    if: >-
      ${{ github.event_name != 'push' || (
        !startsWith(github.event.head_commit.message, 'Update review publish confirmation') &&
        !startsWith(github.event.head_commit.message, 'Update review draft import') &&
        !startsWith(github.event.head_commit.message, 'Update AI metadata') &&
        !startsWith(github.event.head_commit.message, 'Publish reviewed issue')
      ) }}
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
      GOOGLE_DRIVE_REMOTE: ${{ vars.GOOGLE_DRIVE_REMOTE }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      AI_ALLOW_PAID_API: ${{ inputs.run_ai == 'true' && inputs.paid_ai_confirm == 'true' && 'true' || 'false' }}
      AI_ISSUE_ID: ${{ (inputs.ai_issue_id == 'published' || inputs.ai_issue_id == 'new-legacy') && 'changed' || inputs.ai_issue_id }}
      AI_LIMIT: ${{ inputs.ai_limit }}
      SYNC_DRIVE_ENABLED: ${{ inputs.sync_drive == 'true' }}
      PUBLIC_SITE_URL: https://newsletter.qiji.org.tw
      PUBLIC_BASE_PATH: /
      PUBLIC_REVIEW_PUBLISH_WEBHOOK_URL: ${{ vars.REVIEW_PUBLISH_WEBHOOK_URL || secrets.REVIEW_PUBLISH_WEBHOOK_URL }}
      REVIEW_PUBLISH_JSON: ${{ inputs.review_publish_json }}
      REQUESTED_IMPORT_TARGET: ${{ inputs.ai_issue_id }}
      REVIEW_IMPORT_RAN: "false"
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test review metadata overrides
        run: pnpm test:review-metadata

      - name: Test scoped review imports
        shell: pwsh
        run: |
          pnpm test:review-scope
          pwsh -NoProfile -File scripts/test_review_import_scope.ps1

      - name: Test Word image and Pixabay rules
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test_word_image_placement.ps1
          pwsh -NoProfile -File scripts/test_pixabay_image_rules.ps1

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            各期電子報
            public/assets/articles
            public/assets/pixabay
            src/data/pixabayFallbackImages.json
          key: qiji-import-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qiji-import-cache-${{ runner.os }}-${{ github.ref_name }}-
            qiji-import-cache-${{ runner.os }}-

      - name: Install rclone when Google Drive secret exists
        if: ${{ env.RCLONE_CONFIG_CONTENT != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Sync Google Drive source
        if: ${{ env.SYNC_DRIVE_ENABLED == 'true' && env.RCLONE_CONFIG_CONTENT != '' && env.GOOGLE_DRIVE_REMOTE != '' }}
        timeout-minutes: 60
        shell: pwsh
        run: |
          $publishState = Get-Content -LiteralPath src/data/publishState.json -Raw | ConvertFrom-Json
          . ./scripts/resolve_review_import_request.ps1
          $importRequest = Resolve-ReviewImportRequest `
            -EventName $env:GITHUB_EVENT_NAME `
            -RequestedImportTarget $env:REQUESTED_IMPORT_TARGET `
            -ReviewPublishJson $env:REVIEW_PUBLISH_JSON
          $scope = [string]$importRequest.Scope
          $knownIssueIds = @(
            @("src/data/generatedArticles.ts", "src/data/reviewDraftArticles.ts") |
              Where-Object { Test-Path -LiteralPath $_ } |
              ForEach-Object { Select-String -LiteralPath $_ -Pattern '"issueId"\s*:\s*"(20\d{4})"' -AllMatches } |
              ForEach-Object { $_.Matches } |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique
          )
          $selection = Join-Path $env:RUNNER_TEMP "review-import-selection.json"
          $sourceCacheRoot = Join-Path $env:GITHUB_WORKSPACE "各期電子報"
          ./scripts/sync_google_drive.ps1 `
            -Destination $sourceCacheRoot `
            -Scope $scope `
            -PublicLatestIssueId ([string]$publishState.publicLatestIssueId) `
            -SpecificIssueId ([string]$importRequest.SpecificIssueId) `
            -KnownIssueIds $knownIssueIds `
            -SelectionFile $selection
          "REVIEW_IMPORT_SCOPE=$scope" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REVIEW_IMPORT_SELECTION=$selection" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REVIEW_SOURCE_ROOT=$sourceCacheRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AI_ISSUE_ID=$($importRequest.AiIssueId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate article data
        shell: pwsh
        run: |
          if ($env:SYNC_DRIVE_ENABLED -eq "true" -and $env:GOOGLE_DRIVE_REMOTE) {
            $selection = Get-Content -LiteralPath $env:REVIEW_IMPORT_SELECTION -Raw | ConvertFrom-Json
            $selectedIssueIds = @($selection.selectedIssueIds)
            if ($env:REVIEW_IMPORT_SCOPE -ne "all" -and $selectedIssueIds.Count -eq 0) {
              Write-Host "No issue folder matched scope '$env:REVIEW_IMPORT_SCOPE'; keeping current review draft unchanged."
              $emptyReport = [ordered]@{
                generatedAt = (Get-Date).ToUniversalTime().ToString("o")
                totalChanged = 0
                cacheBaselineRebuilt = 0
                changedFiles = @()
                scope = $env:REVIEW_IMPORT_SCOPE
              } | ConvertTo-Json -Depth 4
              New-Item -ItemType Directory -Force -Path public/data | Out-Null
              New-Item -ItemType Directory -Force -Path reports | Out-Null
              Set-Content -LiteralPath public/data/import-changed-files.json -Value $emptyReport -Encoding UTF8
              Set-Content -LiteralPath reports/import-changed-files.json -Value $emptyReport -Encoding UTF8
              exit 0
            }
            Copy-Item -LiteralPath src/data/generatedArticles.ts -Destination $env:RUNNER_TEMP/generatedArticles.published.ts -Force
            Copy-Item -LiteralPath src/data/reviewDraftArticles.ts -Destination $env:RUNNER_TEMP/reviewDraftArticles.previous.ts -Force
            if (-not [string]::IsNullOrWhiteSpace($env:REVIEW_PUBLISH_JSON)) {
              $publishedBase = Get-Content -LiteralPath src/data/generatedArticles.ts -Raw
              $publishedBase = $publishedBase -replace 'generatedArticles', 'reviewDraftArticles'
              $publishedBase = $publishedBase -replace 'generatedIssues', 'reviewDraftIssues'
              Set-Content -LiteralPath $env:RUNNER_TEMP/reviewDraftArticles.previous.ts -Value $publishedBase -Encoding UTF8
            }
            Copy-Item -LiteralPath src/data/generatedReview.ts -Destination $env:RUNNER_TEMP/generatedReview.previous.ts -Force
            if (Test-Path -LiteralPath .cache/article-import-cache.json) {
              Copy-Item -LiteralPath .cache/article-import-cache.json -Destination $env:RUNNER_TEMP/article-import-cache.previous.json -Force
            }
            $generateArguments = @{ SourceRoot = $env:REVIEW_SOURCE_ROOT }
            if ($env:REVIEW_IMPORT_SCOPE -ne "all") {
              $generateArguments.IssueIds = $selectedIssueIds
            }
            ./scripts/generate_archive.ps1 @generateArguments
            if ($env:REVIEW_IMPORT_SCOPE -ne "all") {
              node scripts/merge_scoped_review_import.mjs `
                --selection=$env:REVIEW_IMPORT_SELECTION `
                --previousDraft=$env:RUNNER_TEMP/reviewDraftArticles.previous.ts `
                --previousReview=$env:RUNNER_TEMP/generatedReview.previous.ts `
                --previousCache=$env:RUNNER_TEMP/article-import-cache.previous.json `
                --generated=src/data/generatedArticles.ts `
                --generatedReview=src/data/generatedReview.ts `
                --cache=.cache/article-import-cache.json
            }
            "REVIEW_IMPORT_RAN=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "No Google Drive remote configured; using committed generated data."
          }

      - name: Optimize oversized article images
        run: pnpm assets:optimize

      - name: Separate review draft from published data
        if: ${{ env.SYNC_DRIVE_ENABLED == 'true' && env.GOOGLE_DRIVE_REMOTE != '' && env.REVIEW_IMPORT_RAN == 'true' }}
        shell: pwsh
        run: |
          $draft = Get-Content -LiteralPath src/data/generatedArticles.ts -Raw
          $draft = $draft -replace 'generatedArticles', 'reviewDraftArticles'
          $draft = $draft -replace 'generatedIssues', 'reviewDraftIssues'
          Set-Content -LiteralPath src/data/reviewDraftArticles.ts -Value $draft -Encoding UTF8

          if ([string]::IsNullOrWhiteSpace($env:REVIEW_PUBLISH_JSON)) {
            Copy-Item -LiteralPath $env:RUNNER_TEMP/generatedArticles.published.ts -Destination src/data/generatedArticles.ts -Force
            Write-Host "Synced Word is available in review draft data and import reports. Published article data was restored."
          } else {
            Write-Host "Publish confirmation provided; synced Word remains promoted as published article data."
          }

      - name: Generate AI metadata for synced draft
        if: ${{ env.SYNC_DRIVE_ENABLED == 'true' && env.REVIEW_IMPORT_RAN == 'true' }}
        env:
          AI_ALLOW_PAID_API: "true"
          AI_SOURCE_ROOT: ${{ github.workspace }}/各期電子報
        run: pnpm ai:metadata

      - name: Generate AI metadata manually
        if: ${{ inputs.sync_drive != 'true' && inputs.run_ai == 'true' && inputs.paid_ai_confirm == 'true' }}
        run: pnpm ai:metadata

      - name: Persist synced review draft
        if: ${{ env.SYNC_DRIVE_ENABLED == 'true' && env.REVIEW_IMPORT_RAN == 'true' && inputs.review_publish_json == '' }}
        run: |
          if git diff --quiet -- src/data/reviewDraftArticles.ts src/data/generatedReview.ts src/data/publishState.json src/data/aiMetadata.json public/assets/articles public/data/import-changed-files.json; then
            echo "Review draft unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviewDraftArticles.ts src/data/generatedReview.ts src/data/publishState.json src/data/aiMetadata.json public/assets/articles public/data/import-changed-files.json
          git commit -m "Update review draft import"
          git push

      - name: Persist AI metadata
        if: ${{ env.SYNC_DRIVE_ENABLED == 'true' || inputs.run_ai == 'true' }}
        run: |
          if git diff --quiet -- src/data/aiMetadata.json; then
            echo "AI metadata unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/aiMetadata.json
          git commit -m "Update AI metadata"
          git push

      - name: Apply review publish confirmation
        if: ${{ inputs.review_publish_json != '' }}
        shell: pwsh
        run: |
          $payload = [string]$env:REVIEW_PUBLISH_JSON
          try {
            $payload | ConvertFrom-Json | Out-Null
            Set-Content -LiteralPath review-publish.json -Value $payload -Encoding UTF8
            Write-Host "Using review publish JSON from workflow input."
          } catch {
            if (Test-Path -LiteralPath review-publish.json) {
              Write-Warning "Workflow input was not valid JSON; using committed review-publish.json instead."
            } else {
              throw
            }
          }

          ./scripts/apply_review_publish.ps1 -PublishFile review-publish.json

      - name: Persist review publish state
        if: ${{ inputs.review_publish_json != '' }}
        run: |
          if git diff --quiet -- review-publish.json src/data/editorialOverrides.json src/data/publishState.json src/data/aiFeedbackExamples.json src/data/generatedArticles.ts src/data/generatedReview.ts src/data/reviewDraftArticles.ts public/assets/articles public/data/import-changed-files.json; then
            echo "Review publish state unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-publish.json src/data/editorialOverrides.json src/data/publishState.json src/data/aiFeedbackExamples.json src/data/generatedArticles.ts src/data/generatedReview.ts src/data/reviewDraftArticles.ts public/assets/articles public/data/import-changed-files.json
          git commit -m "Publish reviewed issue"
          git push

      - name: Build
        run: pnpm build

      - name: Verify old-draft visibility
        run: pnpm test:review-legacy

      - name: Deploy the same build to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_PAGES_PROJECT != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: pnpm dlx wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload import reports
        uses: actions/upload-artifact@v4
        with:
          name: qiji-newsletter-reports
          path: reports

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
